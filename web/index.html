<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-jtV2FIxy4X2wtE23A0izgYxYGKh5FcEOmeZVzTccf0E='; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>Universal Agent Architect — Offline Prototype</title>
<style>
:root {
  color-scheme: light;
  font-family: "BIZ UDPGothic", "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  --ui-bg: #f5f7fb;
  --ui-surface: #ffffff;
  --ui-surface-subtle: #f7f9fc;
  --ui-output: #f0f3f7;
  --ui-text: #1d2736;
  --ui-muted: #53657b;
  --ui-border: #dce3ed;
  --ui-control-border: #aebdce;
  --ui-primary: #1957a4;
  --ui-primary-hover: #124681;
  --ui-success: #17633a;
  --ui-success-bg: #eaf7ef;
  --ui-warning: #704f00;
  --ui-warning-bg: #fff8e6;
  --ui-danger: #8a2525;
  --ui-danger-bg: #fff0f0;
  --ui-status-bg: #eef3f9;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ui-bg); color: var(--ui-text); }
main { max-width: 920px; margin: 2rem auto; padding: 1.5rem; }
.app-header, .panel, .result-panel { background: var(--ui-surface); border: 1px solid var(--ui-border); border-radius: 16px; }
.app-header { padding: 2rem; }
.eyebrow { margin: 0 0 .35rem; color: var(--ui-primary); font-size: .85rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.35rem); line-height: 1.2; }
.lead { margin: .8rem 0 0; color: var(--ui-muted); }
.panel { margin-top: 1rem; padding: 1.25rem; }
fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
legend, .section-title { margin-bottom: .7rem; font-size: 1.15rem; font-weight: 750; }
.section-help { margin: -.3rem 0 1rem; color: var(--ui-muted); font-size: .92rem; }
.source-grid { display: grid; gap: .8rem; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.source-card { display: flex; min-height: 9rem; flex-direction: column; gap: .45rem; padding: 1rem; background: var(--ui-surface-subtle); border: 1px solid var(--ui-border); border-radius: 12px; }
.source-card strong { font-size: 1rem; }
.source-card small { flex: 1; color: var(--ui-muted); font-size: .86rem; line-height: 1.45; }
input[type="file"] { width: 100%; font-size: .88rem; }
.options-grid { display: grid; gap: 1rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.control { display: flex; flex-direction: column; gap: .35rem; font-weight: 650; }
select { width: 100%; padding: .6rem .7rem; border: 1px solid var(--ui-control-border); border-radius: 8px; background: var(--ui-surface); font: inherit; }
.checks { display: grid; gap: .65rem; margin-top: 1.15rem; }
.check { display: flex; align-items: flex-start; gap: .55rem; font-weight: 600; }
.check input { width: 1.1rem; height: 1.1rem; margin-top: .25rem; accent-color: var(--ui-primary); }
.actions { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 1.25rem; }
button { padding: .7rem 1rem; border: 0; border-radius: 8px; background: var(--ui-primary); color: var(--ui-surface); font: inherit; font-weight: 700; cursor: pointer; }
button:hover:not(:disabled) { background: var(--ui-primary-hover); }
button:disabled { cursor: not-allowed; opacity: .55; }
.note { margin: 1rem 0 0; color: var(--ui-muted); font-size: .9rem; }
.result-panel { margin-top: 1rem; padding: 1.25rem; }
.status { margin: 0 0 1rem; padding: .8rem 1rem; border-radius: 8px; background: var(--ui-status-bg); color: var(--ui-text); }
.status[data-state="success"] { background: var(--ui-success-bg); color: var(--ui-success); }
.status[data-state="error"] { background: var(--ui-danger-bg); color: var(--ui-danger); }
.status[data-state="progress"] { background: var(--ui-warning-bg); color: var(--ui-warning); }
pre { max-height: 32rem; margin: 0; overflow: auto; padding: 1rem; border-radius: 8px; background: var(--ui-output); white-space: pre-wrap; overflow-wrap: anywhere; }
:where(button, input, select):focus-visible { outline: 3px solid var(--ui-primary); outline-offset: 2px; }
@media (max-width: 700px) {
  main { margin: 0; padding: .75rem; }
  .app-header, .panel, .result-panel { border-radius: 12px; padding: 1rem; }
  .source-grid, .options-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main>
  <header class="app-header">
    <p class="eyebrow">Offline · rule-based</p>
    <h1>Universal Agent Architect</h1>
    <p class="lead">ローカルでプロジェクトの構成を確認し、対象ツール向けのエージェント設定を提案します。AIや外部APIは使用しません。</p>
  </header>

  <section class="panel" aria-labelledby="input-title">
    <fieldset>
      <legend id="input-title">1. 解析対象を選ぶ</legend>
      <p class="section-help">次の3つから1つだけ選択してください。ファイルの内容はブラウザ内で処理されます。</p>
      <div class="source-grid">
        <label class="source-card" for="files">
          <strong>プロジェクトフォルダ</strong>
          <small>フォルダ構成を保ったまま選択します。対応ブラウザではこちらを推奨します。</small>
          <input id="files" type="file" webkitdirectory multiple>
        </label>
        <label class="source-card" for="files-fallback">
          <strong>個別ファイル</strong>
          <small>フォルダ選択に対応していない場合の代替方法です。</small>
          <input id="files-fallback" type="file" multiple>
        </label>
        <label class="source-card" for="zip">
          <strong>安全なZIP</strong>
          <small>非圧縮・安全性検査済みのZIPだけを読み込みます。</small>
          <input id="zip" type="file" accept=".zip,application/zip">
        </label>
      </div>
    </fieldset>
  </section>

  <section class="panel" aria-labelledby="settings-title">
    <h2 id="settings-title" class="section-title">2. 生成条件を選ぶ</h2>
    <div class="options-grid">
      <label class="control" for="target">出力先
        <select id="target">
          <option value="codex">Codex</option>
          <option value="claude-code">Claude Code</option>
          <option value="gemini-cli">Gemini CLI</option>
          <option value="antigravity">Antigravity</option>
          <option value="chatgpt">ChatGPT</option>
        </select>
      </label>
      <label class="control" for="security">セキュリティプロファイル
        <select id="security">
          <option value="baseline">baseline（標準）</option>
          <option value="strict">strict（強化）</option>
        </select>
      </label>
    </div>
    <div class="checks">
      <label class="check"><input id="ast" type="checkbox"> <span>ローカルAST解析を有効化<br><small>Python / TypeScript。明示的に選択した場合のみ実行します。</small></span></label>
      <label class="check"><input id="review" type="checkbox" checked> <span>コードレビュー用のSkillを追加</span></label>
    </div>
    <div class="actions">
      <button id="run" type="button">構成を解析・提案</button>
      <button id="export" type="button" disabled>生成物をZIP保存</button>
    </div>
    <p class="note">未実装の出力先は「未対応」と表示されます。生成物は自動で元プロジェクトへ書き込みません。</p>
  </section>

  <section class="result-panel" aria-labelledby="result-title">
    <h2 id="result-title" class="section-title">解析結果</h2>
    <p id="status" class="status" role="status" data-state="idle">まずプロジェクトフォルダ、個別ファイル、またはZIPを選択してください。</p>
    <pre id="output" aria-live="polite">解析結果はここに表示されます。</pre>
  </section>
</main>
<script type="importmap">{"imports":{"web-tree-sitter":"./web/vendor/web-tree-sitter.js"}}</script>
<script type="module" src="./web/app.mjs"></script>
</body>
</html>
